version: '3.8'
services:
  db:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codepushdb
    ports:
      - "3306:3306"  # MySQL running on localhost:3306
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"  # Redis running on localhost:6379

  localstack:
    image: localstack/localstack
    environment:
      - SERVICES=s3
    ports:
      - "4566:4566"  # LocalStack running on localhost:4566

  app:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "3010:3010"
    env_file:
      - .env
    volumes:
      - ../api:/app/api
      - ../api/node_modules:/app/node_modules
      - ../pm2:/app/pm2
    depends_on:
      - redis
      - db
      - localstack
    working_dir: /app/api
    command: ["/bin/sh", "-c", "sleep 5 && npx ts-node script/storage/seedData.ts && npm run build && pm2-runtime start /app/pm2/pm2-dev.json"]

volumes:
  db_data:
